# Truetone web server config.
# Run: go run ./cmd/web -config config.yaml

host: 0.0.0.0
port: 8080

# Metadata organized as data/metadata/
metadata:
  backend: sqlite
  options: ./data/metadata/metadata.db  # sqlite

# Actual contents organized as data/content/<id>
content:
  backend: fs
  options: ./data/content

# Working path organized as data/job/<id>
job: ./data/job
