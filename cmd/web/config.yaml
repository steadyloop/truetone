# Truetone web server config.
# Run: go run ./cmd/web -config config.yaml

host: localhost
port: 8080

# Video metadata
metadata:
  backend: sqlite
  options: ./data/metadata.db # sqlite: DB file path; created with its table if absent

# HLS output: master.m3u8, stream.m3u8, segment_*.m4s.
content:
  backend: fs
  options: ./data/content # fs: base dir; files land at {dir}/{id}/{filename}

temp_dir: ./data/tmp
